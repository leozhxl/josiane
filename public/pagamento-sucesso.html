<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagamento Aprovado — ALL.ECOM</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:#f0fdf4; }
  .box { background:#fff; border-radius:16px; padding:48px 40px; text-align:center; max-width:440px; box-shadow:0 4px 24px rgba(0,0,0,.08); }
  .icon { font-size:64px; margin-bottom:16px; }
  h1 { color:#16a34a; font-size:28px; margin:0 0 12px; }
  p  { color:#555; margin:0 0 28px; }
  a  { display:inline-block; background:#0038a7; color:#fff; padding:12px 28px; border-radius:8px; text-decoration:none; font-weight:600; }
</style>
</head>
<body>
<div class="box">
  <div class="icon">✅</div>
  <h1>Pagamento Aprovado!</h1>
  <p>Seu pedido foi confirmado com sucesso.<br>Você receberá um e-mail com os detalhes.</p>
  <a href="/">Continuar comprando</a>
</div>
</body>
</html>
